[package]
name = "forcefield-wasm"
description = "wasm-bindgen bindings for the forcefield simulation: positions exposed as a zero-copy Float64Array view"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
forcefield = { path = "../forcefield" }
wasm-bindgen = "0.2"
js-sys = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
